# Desarrollo local: sin TLS, secretos de desarrollo. NO usar en producción.
# Uso: docker compose -f infra/docker-compose.dev.yml up
name: chasqui-dev

services:
  signal:
    build:
      context: ../apps/signal
    ports:
      - "8443:8443"
      - "127.0.0.1:9090:9090"
    environment:
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      TURN_SECRET: dev-secret-no-usar-en-produccion
      TURN_URLS: turn:localhost:3478?transport=udp,turn:localhost:3478?transport=tcp
      SERVER_SSL_ENABLED: "false"
      MANAGEMENT_SERVER_PORT: "9090"

  coturn:
    image: coturn/coturn:4.18.0
    # Puertos mapeados (en vez de network_mode host) para que funcione también en Docker Desktop.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - -c
      - /etc/coturn/turnserver.conf
    volumes:
      - ./coturn/turnserver.dev.conf:/etc/coturn/turnserver.conf:ro
