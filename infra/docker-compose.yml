# Producción: VM Oracle Cloud Always Free (ARM, linux/arm64).
# Uso: copia .env.example a .env, rellénalo y ejecuta scripts/deploy.sh
name: chasqui

services:
  signal:
    image: ghcr.io/1juandaniel0/chasqui-signal:${SIGNAL_TAG:?define SIGNAL_TAG en .env o en el entorno}
    ports:
      - "8443:8443"            # solo accesible desde rangos de Cloudflare (firewall del SO)
      - "127.0.0.1:9090:9090"  # Actuator/métricas: solo localhost
    environment:
      TURN_SECRET: ${TURN_SECRET:?define TURN_SECRET}
      ALLOWED_ORIGINS: https://chaski.me,https://app.chaski.me
      TURN_URLS: turn:turn.chaski.me:3478?transport=udp,turn:turn.chaski.me:3478?transport=tcp,turns:turn.chaski.me:443?transport=tcp
      MANAGEMENT_SERVER_PORT: "9090"
      # TLS de origen con el certificado de origen de Cloudflare (ver docs/primeros-pasos.md).
      # Ajusta estas propiedades si apps/signal usa otros nombres.
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_CERTIFICATE: /certs/origin/origin.pem
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: /certs/origin/origin.key
    volumes:
      - ./certs/origin:/certs/origin:ro
    read_only: true
    tmpfs:
      - /tmp
    user: "10001"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  coturn:
    # Versión fija. Revisa la última estable antes de desplegar: https://hub.docker.com/r/coturn/coturn/tags
    image: coturn/coturn:4.6.3
    network_mode: host # el rango UDP de relevo es grande; mapearlo en Docker es lento
    # coturn necesita enlazar el puerto 443 (<1024): arranca como root y él mismo baja privilegios.
    user: root
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE, SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --external-ip=${TURN_EXTERNAL_IP:?define TURN_EXTERNAL_IP como IPpublica/IPprivada}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./certs/turn:/etc/coturn/certs:ro
    restart: unless-stopped
