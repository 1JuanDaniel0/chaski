# coturn para desarrollo local. Secreto de desarrollo, sin TLS, sin bloqueo de peers privados
# (en local los dos navegadores están en 127.0.0.1 / red privada). NO usar en producción.
listening-port=3478
min-port=49160
max-port=49200

use-auth-secret
static-auth-secret=dev-secret-no-usar-en-produccion
realm=localhost

fingerprint
no-cli
no-tls
no-dtls
no-multicast-peers
verbose
