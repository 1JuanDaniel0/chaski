# coturn de producción. Se carga con: -c /etc/coturn/turnserver.conf
# Los secretos y la IP pública llegan por línea de comandos desde docker-compose.yml:
#   --static-auth-secret=$TURN_SECRET
#   --external-ip=<IP pública>/<IP privada>   (NAT 1:1 de Oracle; sin esto anuncia la IP privada)
# Si prefieres fijarla aquí: external-ip=203.0.113.10/10.0.0.5

listening-port=3478
tls-listening-port=443
min-port=49160
max-port=49360

# Credenciales temporales (TURN REST API). El secreto va por --static-auth-secret.
use-auth-secret
realm=turn.chaski.me

# TLS (Let's Encrypt, ver infra/scripts/renew-turn-cert.sh)
cert=/etc/coturn/certs/fullchain.pem
pkey=/etc/coturn/certs/privkey.pem
no-tlsv1
no-tlsv1_1

fingerprint
no-cli
no-tcp-relay
no-multicast-peers

# Evita que TURN sirva de proxy hacia redes internas o metadatos de la nube (SSRF).
# 169.254.0.0/16 incluye 169.254.169.254 (metadatos de Oracle/AWS/etc.).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# IPv6: loopback, ULA (fc00::/7) y link-local (fe80::/10)
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Cuotas. max-bps y bps-capacity van en BYTES por segundo, no en bits.
user-quota=4
total-quota=200
# Por sesión: 2 MB/s (16 Mbps).
max-bps=2000000
# Tope del servidor entero: 10 MB/s (80 Mbps), unas 5 sesiones por relevo a toda velocidad.
# Acota el peor caso de abuso a ~36 GB/h de salida (~3 USD/h en AWS) en vez de lo que dé la VM.
bps-capacity=10000000

# Logs: sin ruido; no guardes IPs más tiempo del necesario
simple-log
