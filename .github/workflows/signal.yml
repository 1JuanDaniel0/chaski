name: signal

on:
  push:
    branches: [main]
    paths:
      - "apps/signal/**"
      - ".github/workflows/signal.yml"
      - "infra/**"
  pull_request:
    paths:
      - "apps/signal/**"
      - ".github/workflows/signal.yml"

permissions:
  contents: read

concurrency:
  group: signal-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/1juandaniel0/chasqui-signal

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/signal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify

  image:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: apps/signal
          file: apps/signal/Dockerfile
          platforms: linux/arm64,linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-latest
    # Crea el environment "production" en Settings > Environments (puedes pedir aprobación manual).
    environment: production
    permissions:
      contents: read
    env:
      # Los secretos no se pueden usar directo en `if`; se copian a variables de entorno.
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_USER: ${{ secrets.VM_USER }}
      VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
    steps:
      - name: Comprobar secretos
        id: gate
        run: |
          if [ -n "$VM_HOST" ] && [ -n "$VM_USER" ] && [ -n "$VM_SSH_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Faltan secretos VM_HOST, VM_USER o VM_SSH_KEY: se omite el despliegue."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Desplegar por SSH
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script_stop: true
          # En la VM el repo está clonado en ~/chasqui y infra/.env ya existe.
          script: |
            cd ~/chasqui
            git pull --ff-only
            SIGNAL_TAG=${{ github.sha }} ./infra/scripts/deploy.sh
